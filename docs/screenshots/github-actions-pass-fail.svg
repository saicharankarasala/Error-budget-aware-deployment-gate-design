<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="GitHub Actions screenshot showing pass and fail deployment gate runs">
  <rect width="1280" height="720" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1280" height="64" fill="#24292f"/>
  <text x="28" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">GitHub Actions - Error Budget Aware Deployment</text>
  <g transform="translate(56 112)">
    <rect width="1168" height="112" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="42" cy="56" r="15" fill="#1a7f37"/>
    <path d="M34 56 L40 62 L51 49" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="45" fill="#24292f" font-family="Arial, sans-serif" font-size="18" font-weight="700">main - deploy 8f31c21</text>
    <text x="76" y="76" fill="#57606a" font-family="Arial, sans-serif" font-size="14">Unit tests passed - burn-rate gate PASS - canary promoted</text>
    <text x="988" y="62" fill="#57606a" font-family="Arial, sans-serif" font-size="14">4m 18s</text>
  </g>
  <g transform="translate(56 252)">
    <rect width="1168" height="112" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="42" cy="56" r="15" fill="#cf222e"/>
    <path d="M35 49 L49 63 M49 49 L35 63" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="76" y="45" fill="#24292f" font-family="Arial, sans-serif" font-size="18" font-weight="700">main - deploy b7ac904</text>
    <text x="76" y="76" fill="#57606a" font-family="Arial, sans-serif" font-size="14">Unit tests passed - burn-rate gate FAIL - issue opened - deploy blocked</text>
    <text x="988" y="62" fill="#57606a" font-family="Arial, sans-serif" font-size="14">2m 09s</text>
  </g>
  <g transform="translate(90 420)">
    <rect width="1100" height="210" rx="8" fill="#0d1117"/>
    <text x="24" y="38" fill="#7ee787" font-family="Menlo, monospace" font-size="15">Run python -m gate.cli --prometheus-url *** --short-window 1h --long-window 6h --output json</text>
    <text x="24" y="74" fill="#f0f6fc" font-family="Menlo, monospace" font-size="15">{</text>
    <text x="48" y="102" fill="#ff7b72" font-family="Menlo, monospace" font-size="15">"status": "FAIL",</text>
    <text x="48" y="130" fill="#a5d6ff" font-family="Menlo, monospace" font-size="15">"reasons": ["1h availability burn 7.80x exceeds 4.00x", "6h p95 latency 0.480s exceeds 0.300s"]</text>
    <text x="24" y="158" fill="#f0f6fc" font-family="Menlo, monospace" font-size="15">}</text>
    <text x="24" y="190" fill="#ff7b72" font-family="Menlo, monospace" font-size="15">Deployment blocked by error-budget-aware gate.</text>
  </g>
</svg>

