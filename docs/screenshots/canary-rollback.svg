<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Canary success and rollback screenshot">
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1280" height="64" fill="#111827"/>
  <text x="28" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Canary Rollout Decision Log</text>
  <g transform="translate(88 110)">
    <rect width="500" height="490" rx="10" fill="#ffffff" stroke="#d8dee9"/>
    <text x="28" y="42" fill="#166534" font-family="Arial, sans-serif" font-size="20" font-weight="700">Healthy canary</text>
    <line x1="60" y1="90" x2="60" y2="410" stroke="#bbf7d0" stroke-width="6"/>
    <circle cx="60" cy="115" r="18" fill="#16a34a"/>
    <circle cx="60" cy="230" r="18" fill="#16a34a"/>
    <circle cx="60" cy="345" r="18" fill="#16a34a"/>
    <text x="100" y="122" fill="#334155" font-family="Arial, sans-serif" font-size="17">10% traffic - PASS</text>
    <text x="100" y="237" fill="#334155" font-family="Arial, sans-serif" font-size="17">50% traffic - PASS</text>
    <text x="100" y="352" fill="#334155" font-family="Arial, sans-serif" font-size="17">100% traffic - PROMOTED</text>
    <rect x="36" y="430" width="420" height="34" rx="17" fill="#dcfce7"/>
    <text x="58" y="452" fill="#166534" font-family="Arial, sans-serif" font-size="15" font-weight="700">No rollback lock written</text>
  </g>
  <g transform="translate(692 110)">
    <rect width="500" height="490" rx="10" fill="#ffffff" stroke="#d8dee9"/>
    <text x="28" y="42" fill="#991b1b" font-family="Arial, sans-serif" font-size="20" font-weight="700">Unhealthy canary</text>
    <line x1="60" y1="90" x2="60" y2="330" stroke="#fecaca" stroke-width="6"/>
    <circle cx="60" cy="115" r="18" fill="#ef4444"/>
    <circle cx="60" cy="230" r="18" fill="#ef4444"/>
    <text x="100" y="122" fill="#334155" font-family="Arial, sans-serif" font-size="17">10% traffic - FAIL</text>
    <text x="100" y="154" fill="#991b1b" font-family="Arial, sans-serif" font-size="14">availability burn 92.00x</text>
    <text x="100" y="237" fill="#334155" font-family="Arial, sans-serif" font-size="17">rollback triggered</text>
    <text x="100" y="269" fill="#991b1b" font-family="Arial, sans-serif" font-size="14">canary_weight=0, active_version=stable</text>
    <rect x="36" y="430" width="420" height="34" rx="17" fill="#fee2e2"/>
    <text x="58" y="452" fill="#991b1b" font-family="Arial, sans-serif" font-size="15" font-weight="700">runtime/rollback.lock prevents loops</text>
  </g>
</svg>

