name: Error Budget Aware Deployment

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  deployment-gate:
    name: Burn-rate deployment gate
    runs-on: ubuntu-latest
    needs:
      - test
    env:
      PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Evaluate SLO burn rate
        id: gate
        shell: bash
        run: |
          set +e
          if [[ -n "${PROMETHEUS_URL}" ]]; then
            python -m gate.cli \
              --prometheus-url "${PROMETHEUS_URL}" \
              --short-window 1h \
              --long-window 6h \
              --output json | tee gate-result.json
          else
            echo "PROMETHEUS_URL is not configured; using deterministic healthy sample for repository CI."
            python -m gate.cli \
              --sample-file examples/safe_metrics.json \
              --output json | tee gate-result.json
          fi
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Open incident issue when deployment is blocked
        if: steps.gate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const result = fs.readFileSync("gate-result.json", "utf8");
            const title = `Deployment blocked by SLO burn-rate gate (${context.sha.substring(0, 7)})`;
            const body = [
              "The deployment gate failed closed because live SLO burn-rate checks exceeded the configured safety thresholds.",
              "",
              "```json",
              result,
              "```",
              "",
              "Expected response:",
              "- Keep production deployment blocked.",
              "- Investigate current error budget burn and latency.",
              "- Re-run the workflow only after metrics return below the safe threshold."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["deployment-blocked", "slo", "incident-review"]
            });

      - name: Enforce gate result
        if: steps.gate.outputs.exit_code != '0'
        run: |
          echo "Deployment blocked by error-budget-aware gate."
          exit 1

  deploy:
    name: Deploy and canary
    runs-on: ubuntu-latest
    needs:
      - deployment-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
      PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
      ROUTER_URL: ${{ secrets.ROUTER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials with OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build image
        run: docker build -f app/Dockerfile -t error-budget-gate:${{ github.sha }} .

      - name: Push image to ECR
        if: env.AWS_ROLE_TO_ASSUME != '' && env.ECR_REPOSITORY_URL != ''
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%/*}"
          docker tag error-budget-gate:${{ github.sha }} "${ECR_REPOSITORY_URL}:${{ github.sha }}"
          docker push "${ECR_REPOSITORY_URL}:${{ github.sha }}"

      - name: Canary rollout guard
        if: env.PROMETHEUS_URL != '' && env.ROUTER_URL != ''
        run: |
          python scripts/canary_rollout.py \
            --prometheus-url "${PROMETHEUS_URL}" \
            --router-url "${ROUTER_URL}" \
            --weights 10,50,100 \
            --window 5m

      - name: Deployment wiring note
        if: env.AWS_ROLE_TO_ASSUME == ''
        run: |
          echo "AWS deployment skipped. Configure AWS_ROLE_TO_ASSUME and ECR_REPOSITORY_URL to enable cloud deploys."
